<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart & Checkout | Profitable Tulip</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation -->
  <header>
    <nav class="nav-container">
      <a href="index.html" class="logo-link">
        <div class="logo">
          <img src="logo.png" alt="Logo" class="brand-logo-img">
          <h2>Profitable Tulip</h2>
        </div>
      </a>
      <div class="nav-links" id="nav-menu">
        <a href="index.html">Home</a>
        <a href="services.html">Services Hub</a>
        <a href="cart.html" class="active">Cart <span id="cart-counter" class="cart-count-badge">0</span>🛒</a>
      </div>
    </nav>
  </header>

  <main id="main" style="max-width: 1200px; margin: 4rem auto; padding: 0 1.5rem;">
    <div class="section-header">
      <span class="sub-title">SECURE ORDER REVIEW</span>
      <h2>Your Shopping Cart</h2>
    </div>

    <div class="pricing-grid" style="grid-template-columns: 1.5fr 1fr; gap: 2rem; align-items: flex-start;">
      
      <!-- Cart Items List -->
      <div class="price-card" style="text-align: left;">
        <h3>Selected Services</h3>
        <div id="cart-items-container" style="margin: 1.5rem 0;">
          <!-- Dynamic JS will inject items here -->
        </div>
        <button onclick="clearCart()" style="background: #ef4444; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer;">Clear Cart</button>
      </div>

      <!-- Checkout Form -->
      <div class="price-card featured" style="text-align: left;">
        <h3>Client Details</h3>
        <form id="checkout-form" style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
          <input type="text" id="client-name" placeholder="Your Name / Brand" required style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-light); padding: 0.8rem; border-radius: 10px; color: #fff; outline: none;">
          <input type="text" id="client-handle" placeholder="Social Link / Handle" required style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-light); padding: 0.8rem; border-radius: 10px; color: #fff; outline: none;">
          
          <button type="button" onclick="checkoutWhatsApp()" class="card-btn primary" style="padding: 1rem; cursor: pointer; border: none; width: 100%;">
            💬 Send Order to WhatsApp ⚡
          </button>
        </form>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
